name: Build Nexora Calc Customer and Admin APKs
on:
  workflow_dispatch:
  push:
    branches: [main, customer-admin-separate]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - run: npm install
      - name: Generate Android project
        run: npx cap add android
      - name: Generate launcher icons
        run: |
          python -m pip install --quiet Pillow
          python scripts/generate-android-icons.py
      - name: Build Customer APK
        env: { VITE_APP_ROLE: customer }
        run: |
          npm run build
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew clean assembleDebug
          mkdir -p ../release
          cp app/build/outputs/apk/debug/app-debug.apk ../release/Nexora-Calc-Customer.apk
      - name: Configure Admin application identity
        run: |
          sed -i "s/com.nexora.calc/com.nexora.calc.admin/" capacitor.config.ts
          sed -i "s/Nexora Digital Calculator/Nexora Calc Admin/" capacitor.config.ts
      - name: Recreate Android project for separate Admin package
        run: |
          rm -rf android
          npx cap add android
          python scripts/generate-android-icons.py
      - name: Build Admin APK
        env: { VITE_APP_ROLE: admin }
        run: |
          npm run build
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew clean assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../release/Nexora-Calc-Admin.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Nexora-Calc-Customer-and-Admin-APKs
          path: release/*.apk
          if-no-files-found: error
          retention-days: 14
